<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f8f2" />
    <title>Offline — Vitals &amp; Vitality</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #183527; background: #f5f8f2; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 28rem; padding: 2rem; border: 1px solid #dce8dc; border-radius: 1.5rem; background: white; box-shadow: 0 1rem 3rem #18352712; }
      h1 { margin-top: 0; font-size: 1.6rem; }
      p { line-height: 1.6; color: #52665a; }
      button { margin-top: 0.75rem; border: 0; border-radius: 999px; padding: 0.8rem 1.2rem; color: white; background: #26734b; font: inherit; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to sign in, synchronize your health records, and use the Vitals &amp; Vitality dashboard.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
